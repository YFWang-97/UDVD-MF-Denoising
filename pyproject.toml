# uv alternative to environment.yaml for UDVD-MF-Denoising.
# Target: Linux x86_64, Python 3.11, NVIDIA CUDA 11.8 or CPU-only.
[project]
name = "udvd-mf-denoising"
version = "0.1.0"
description = "Unsupervised deep video denoising for TEM datasets"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Scientific and image-processing dependencies from environment.yaml.
    "numpy==1.26.0",
    "pandas==2.1.1",
    "scipy==1.11.2",
    "scikit-learn==1.3.1",
    "networkx==3.1",
    "sympy==1.12",
    "matplotlib",
    "seaborn==0.12.2",
    "plotly==5.17.0",
    "pyarrow",
    "openpyxl==3.1.2",
    "xlrd==2.0.1",
    "feather-format==0.4.1",
    "statsmodels==0.14.0",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "tqdm==4.66.1",
    "pillow",
    "opencv-python>=4.9,<4.10",
    "h5py==3.10.0",
    "scikit-image==0.22.0",
    "imageio",
    "tifffile",
    "imagecodecs",
    "lazy-loader",
]

# Pick exactly one accelerator when syncing. Including torch only in extras
# prevents accidentally mixing CPU and CUDA wheels.
[project.optional-dependencies]
cu118 = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
]
cpu = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
]
notebooks = [
    "ipykernel==6.25.2",
    "notebook==6.5.4",
    "jupyterlab==3.6.5",
    "nbconvert==6.5.3",
    "ipywidgets==8.1.1",
    "voila==0.4.3",
]

[tool.uv]
package = false
# The existing Conda environment targets Linux CUDA 11.8. Restrict uv's
# universal resolution to the wheel platform expected on HPC installations.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [{ extra = "cu118" }, { extra = "cpu" }],
]

# Source pinning ensures PyTorch uses the correct build; other packages
# continue to come from the standard PyPI index.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchaudio = [
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
